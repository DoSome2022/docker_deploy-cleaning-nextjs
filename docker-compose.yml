# 方案 B：共用 PG（shared-db，喺 ../shared-db 起動）
# - migrate：每次 compose up 跑一次 db push + seed（DB 喺 shared-db）
# - app：等 migrate 成功先起
# 兩個服務都喺 npm-net，直接以容器名 shared-db 連資料庫
#
# .env 嘅 POSTGRES_PASSWORD 要同 shared-db 嘅密碼一致
# 首次部署前（伺服器）：
#   docker network create npm-net && docker network connect npm-net <NPM容器名>
#   cd ../shared-db && docker compose up -d   ← 共用 PG 先起

services:
  migrate:
    build:
      context: .
      target: build
    container_name: cleaning-nextjs-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://popo:${POSTGRES_PASSWORD}@shared-db:5432/cleaning_nextjs_db?schema=public
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts"
    networks:
      - npm-net

  app:
    build: .
    container_name: cleaning-nextjs-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://popo:${POSTGRES_PASSWORD}@shared-db:5432/cleaning_nextjs_db?schema=public
      # Auth.js v5 喺反向代理後需要信任 proxy 嘅 Host header
      AUTH_TRUST_HOST: "true"
      # Docker 會自動 set HOSTNAME=容器ID，Next standalone 會跟住 bind 落單一
      # interface——強制設 0.0.0.0
      HOSTNAME: "0.0.0.0"
      # tRPC Redis 限流（fail-open：Redis 死咗自動放行）
      REDIS_URL: redis://cleaning-nextjs-redis:6379
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # 唔開 host port：由 NPM Proxy Host 指向 cleaning-nextjs-app:3000
    networks:
      - npm-net

  redis:
    image: redis:7-alpine
    container_name: cleaning-nextjs-redis
    ports:
      # 本機 6379~6386 已被其他項目佔用，故此項目用 6387；只為本地除錯用，VPS 上可刪除
      - "6387:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cleaning-nextjs-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - npm-net

volumes:
  cleaning-nextjs-redis-data:

networks:
  npm-net:
    external: true
